<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MyFamily - Árvore Genealógica Colaborativa</title>
        <script src="https://cdn.jsdelivr.net/npm/vue@3.2.47/dist/vue.global.prod.js"></script>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body>
        <div id="app" class="min-h-screen bg-gray-100 p-4">
            <div class="max-w-md mx-auto bg-white p-6 rounded shadow mb-6">
                <h1 class="text-2xl font-bold mb-4">
                    MyFamily - Adicionar Membro
                </h1>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700"
                            >Nome</label
                        >
                        <input
                            v-model="newPerson.name"
                            type="text"
                            class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
                            placeholder="Digite ou selecione o nome"
                            list="nameSuggestions"
                            @input="filterSuggestions"
                            @change="selectOrAddName"
                            required
                        />
                        <datalist id="nameSuggestions">
                            <option
                                v-for="suggestion in filteredSuggestions"
                                :key="suggestion.id"
                                :value="suggestion.name"
                            ></option>
                        </datalist>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700"
                            >Parentesco Principal</label
                        >
                        <select
                            v-model="newPerson.relationship"
                            class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
                            required
                        >
                            <option value="" disabled>
                                Selecione o parentesco
                            </option>
                            <option
                                v-for="rel in relationships"
                                :key="rel"
                                :value="rel"
                            >
                                {{ rel }}
                            </option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700"
                            >Data de Nascimento</label
                        >
                        <input
                            v-model="newPerson.birthDate"
                            type="date"
                            class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
                        />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700"
                            >Data de Falecimento</label
                        >
                        <input
                            v-model="newPerson.deathDate"
                            type="date"
                            class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
                        />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700"
                            >Avatar</label
                        >
                        <input
                            type="file"
                            accept="image/*"
                            @change="handleAvatarUpload"
                            class="mt-1 block w-full"
                        />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700"
                            >Pai/Mãe (opcional)</label
                        >
                        <select
                            v-model="newPerson.parentId"
                            class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
                            :disabled="tree.some(p => p.name === newPerson.name && p.relationship === newPerson.relationship)"
                        >
                            <option :value="null">Nenhum</option>
                            <option
                                v-for="person in uniqueParents"
                                :key="person.id"
                                :value="person.id"
                            >
                                {{ person.name }} ({{ person.relationship }})
                            </option>
                        </select>
                    </div>
                    <button
                        @click="addPerson"
                        class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600"
                    >
                        Adicionar
                    </button>
                </div>
            </div>

            <div class="max-w-4xl mx-auto">
                <h2 class="text-xl font-bold mb-4">Árvore Genealógica</h2>
                <div v-if="tree.length === 0" class="text-gray-500">
                    Nenhum membro adicionado ainda.
                </div>
                <div v-else>
                    <div v-for="person in rootPeople" :key="person.id">
                        <tree-node
                            :person="person"
                            :tree="tree"
                            :depth="0"
                            :expanded-nodes="expandedNodes"
                            @toggle="toggleNode"
                        ></tree-node>
                    </div>
                </div>
            </div>
        </div>

        <script type="text/javascript">
            const { createApp, ref, computed, onMounted } = Vue;

            const TreeNode = {
                name: "TreeNode",
                props: ["person", "tree", "depth", "expanded-nodes"],
                template: `
        <div :class="'ml-' + (depth * 4) + ' p-2 border-l-2 border-gray-300'">
          <div class="flex items-center space-x-2 bg-white p-3 rounded shadow">
            <button @click="$emit('toggle', person.id)" class="text-blue-500">
              {{ expandedNodes.has(person.id) ? '▼' : '▶' }}
            </button>
            <img v-if="person.avatar" :src="person.avatar" :alt="person.name" class="w-10 h-10 rounded-full object-cover">
            <div>
              <p class="font-bold">{{ person.name }}</p>
              <p class="text-sm text-gray-600">{{ person.relationship }}</p>
              <p class="text-sm text-gray-600">
                Nasc: {{ person.birthDate || 'N/A' }}
                <span v-if="person.deathDate"> | Falec: {{ person.deathDate }}</span>
              </p>
              <p class="text-sm">Status: {{ person.validated ? 'Validado' : 'Pendente' }}</p>
              <p v-if="person.relationships && person.relationships.length" class="text-sm text-gray-700">
                Relações: {{ person.relationships.join(', ') }}
              </p>
            </div>
          </div>
          <div v-if="expandedNodes.has(person.id)" class="ml-4">
            <div v-for="child in getChildren(person.id)" :key="child.id">
              <p>Filho: {{ child.name }}</p>
              <tree-node :person="child" :tree="tree" :depth="depth + 1" :expanded-nodes="expandedNodes" @toggle="$emit('toggle', $event)"></tree-node>
            </div>
            <div v-if="person.parentIds && person.parentIds.length">
              <p v-for="parentId in person.parentIds" :key="parentId">
                Pai/Mãe: {{ getParent(parentId).name }} ({{ getParent(parentId).relationship }})
              </p>
            </div>
            <div v-if="person.siblingsIds && person.siblingsIds.length">
              <p v-for="siblingId in person.siblingsIds" :key="siblingId">
                Irmão: {{ getSibling(siblingId).name }} ({{ getSibling(siblingId).relationship }})
              </p>
            </div>
          </div>
        </div>
      `,
                computed: {
                    getChildren() {
                        return (parentId) => {
                            const children = this.tree.filter(
                                (p) =>
                                    p.parentIds &&
                                    p.parentIds.includes(parentId),
                            );
                            console.log(
                                `Children for ${parentId} (depth ${this.depth}):`,
                                children,
                            );
                            return children;
                        };
                    },
                    getParent() {
                        return (parentId) =>
                            this.tree.find((p) => p.id === parentId) || {};
                    },
                    getSibling() {
                        return (siblingId) =>
                            this.tree.find((p) => p.id === siblingId) || {};
                    },
                },
            };

            const app = createApp({
                components: { "tree-node": TreeNode },
                setup() {
                    const tree = ref([]);
                    const newPerson = ref({
                        id: `${Date.now().toString()}-${Math.floor(Math.random() * 1000)}`,
                        name: "",
                        relationship: "",
                        birthDate: "",
                        deathDate: "",
                        avatar: "",
                        parentIds: [],
                        childrenIds: [],
                        siblingsIds: [],
                        validated: true,
                        relationships: [],
                    });
                    const expandedNodes = ref(new Set());
                    const filteredSuggestions = ref([]);
                    const relationships = [
                        "Pai",
                        "Mãe",
                        "Filho",
                        "Filha",
                        "Avô",
                        "Avó",
                        "Neto",
                        "Neta",
                        "Irmão",
                        "Irmã",
                        "Tio",
                        "Tia",
                        "Sobrinho",
                        "Sobrinha",
                        "Primo",
                        "Prima",
                        "Bisavô",
                        "Bisavó",
                        "Bisneto",
                        "Bisneta",
                        "Sogro",
                        "Sogra",
                        "Genro",
                        "Nora",
                        "Cunhado",
                        "Cunhada",
                        "Padrasto",
                        "Madrasta",
                        "Enteado",
                        "Enteada",
                    ];

                    const rootPeople = computed(() =>
                        tree.value.filter((person) => !person.parentIds.length),
                    );
                    const uniqueParents = computed(() => {
                        const seen = new Set();
                        return tree.value.filter(
                            (p) =>
                                p.validated &&
                                !seen.has(p.id) &&
                                seen.add(p.id),
                        );
                    });

                    const filterSuggestions = () => {
                        const input = newPerson.value.name.toLowerCase();
                        filteredSuggestions.value = tree.value
                            .filter((p) => p.name.toLowerCase().includes(input))
                            .map((p) => ({ id: p.id, name: p.name }));
                    };

                    const selectOrAddName = () => {
                        const existing = tree.value.find(
                            (p) => p.name === newPerson.value.name,
                        );
                        if (existing) {
                            alert(
                                "Nome existente selecionado. Um novo ID será gerado para este cadastro. Verifique Parentesco e Pai/Mãe.",
                            );
                        }
                        newPerson.value.id = `${Date.now().toString()}-${Math.floor(Math.random() * 1000)}`;
                    };

                    const addPerson = async () => {
                        if (
                            !newPerson.value.name ||
                            !newPerson.value.relationship
                        ) {
                            alert("Nome e parentesco são obrigatórios!");
                            return;
                        }
                        if (
                            tree.value.some(
                                (p) =>
                                    p.name === newPerson.value.name &&
                                    p.relationship ===
                                        newPerson.value.relationship,
                            )
                        ) {
                            alert(
                                "Já existe um membro com esse nome e parentesco! Ajuste o Pai/Mãe ou escolha outro parentesco.",
                            );
                            return;
                        }
                        if (newPerson.value.parentId) {
                            const parent = tree.value.find(
                                (p) => p.id === newPerson.value.parentId,
                            );
                            if (
                                parent &&
                                tree.value.some(
                                    (p) =>
                                        p.name === newPerson.value.name &&
                                        p.parentId === newPerson.value.parentId,
                                )
                            ) {
                                alert(
                                    "Atenção: Já existe um membro com esse nome e mesmo Pai/Mãe. Confirme os dados.",
                                );
                            }
                        }
                        try {
                            const response = await fetch(
                                "http://localhost:3000/members",
                                {
                                    method: "POST",
                                    headers: {
                                        "Content-Type": "application/json",
                                    },
                                    body: JSON.stringify(newPerson.value),
                                },
                            );
                            if (!response.ok) {
                                const error = await response.json();
                                alert(
                                    error.message ||
                                        "Erro ao adicionar membro!",
                                );
                                return;
                            }
                            newPerson.value = {
                                id: `${Date.now().toString()}-${Math.floor(Math.random() * 1000)}`,
                                name: "",
                                relationship: "",
                                birthDate: "",
                                deathDate: "",
                                avatar: "",
                                parentIds: [],
                                childrenIds: [],
                                siblingsIds: [],
                                validated: true,
                                relationships: [],
                            };
                            await fetchTree();
                        } catch (error) {
                            alert("Erro ao conectar ao servidor!");
                            console.error(error);
                        }
                    };

                    const handleAvatarUpload = (event) => {
                        const file = event.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onloadend = () => {
                                newPerson.value.avatar = reader.result;
                            };
                            reader.readAsDataURL(file);
                        }
                    };

                    const toggleNode = (id) => {
                        const newSet = new Set(expandedNodes.value);
                        if (newSet.has(id)) {
                            newSet.delete(id);
                        } else {
                            newSet.add(id);
                        }
                        console.log("Expanded nodes:", Array.from(newSet));
                        expandedNodes.value = newSet;
                    };

                    const fetchTree = async () => {
                        try {
                            const response = await fetch(
                                "http://localhost:3000/members",
                            );
                            if (response.ok) {
                                const data = await response.json();
                                console.log("Fetched tree:", data);
                                tree.value = data;
                            } else {
                                alert("Erro ao carregar a árvore!");
                            }
                        } catch (error) {
                            alert("Erro ao conectar ao servidor!");
                            console.error(error);
                        }
                    };

                    onMounted(() => {
                        fetchTree();
                    });

                    return {
                        tree,
                        newPerson,
                        expandedNodes,
                        relationships,
                        rootPeople,
                        uniqueParents,
                        filteredSuggestions,
                        filterSuggestions,
                        selectOrAddName,
                        addPerson,
                        handleAvatarUpload,
                        toggleNode,
                        fetchTree,
                    };
                },
            });

            app.mount("#app");
        </script>
    </body>
</html>
